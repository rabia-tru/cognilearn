<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Tilted Background Card -->
  <rect x="170" y="105" width="220" height="290" rx="28" fill="#a5b4fc" opacity="0.4" transform="rotate(12 280 250)"/>
  <rect x="135" y="115" width="220" height="290" rx="28" fill="#c7d2fe" opacity="0.6" transform="rotate(-6 245 260)"/>

  <!-- Main Active Front Card -->
  <rect x="136" y="120" width="240" height="300" rx="28" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Card Header Badge -->
  <rect x="176" y="156" width="90" height="18" rx="9" fill="#e0e7ff"/>
  <circle cx="330" cy="165" r="8" fill="#10b981"/>

  <!-- Brain & Sparkle Emblem on Card -->
  <g transform="translate(196, 205) scale(1.4)">
    <!-- Stylized Brain Curves -->
    <path d="M25 8 C14 8 6 17 6 27 C6 33 9 38 14 42 C12 46 12 51 15 55 C18 59 23 61 28 61 C32 61 36 59 38 56 C41 60 46 62 52 61 C58 60 62 55 63 49 C67 45 69 39 68 33 C67 23 58 15 48 16 C46 11 41 8 35 8 C32 8 28 9 25 8 Z" 
          fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37 17 C37 32 37 46 37 57" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 28 C26 28 32 32 37 32" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M37 40 C43 40 48 44 54 44" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Accent Sparkle -->
  <path d="M380 95 Q380 120 405 120 Q380 120 380 145 Q380 120 355 120 Q380 120 380 95 Z" fill="#fbbf24"/>
  <path d="M110 375 Q110 390 125 390 Q110 390 110 405 Q110 390 95 390 Q110 390 110 375 Z" fill="#fbbf24" opacity="0.9"/>
</svg>
